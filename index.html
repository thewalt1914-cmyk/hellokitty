<!doctype html>
<html lang="en">
<head>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel+Decorative:wght@700;900&family=Comic+Neue:wght@300;400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper:#fff9ef;
      --muted:#6b6b6b;
      --ink:#0b0b0b;
      --accent:#ffd54f;
    }

    * {
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#0b0a12;
      font-family:'Comic Neue', system-ui, sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      transition:
        background 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Subtle comic halftone overlay */
    body::before {
      content:'';
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      opacity:.18;

      background-image:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,.15) 1px,
          transparent 1px
        );

      background-size:10px 10px;
    }

    #scene {
      position:fixed;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    /* Horizontal Carousel Container */
    .worlds {
      position:relative;
      z-index:2;

      display:flex;
      flex-direction:row;

      width:100vw;
      height:100svh;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;
      scroll-behavior:smooth;

      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }

    .worlds::-webkit-scrollbar {
      display:none;
    }

    /* Comic panel */
    .world {
      flex:0 0 100vw;

      width:100vw;
      height:100svh;
      min-height:100svh;

      display:flex;
      align-items:flex-end;
      justify-content:center;

      padding:
        0
        20px
        clamp(45px, 9svh, 80px)
        20px;

      scroll-snap-align:start;
      scroll-snap-stop:always;

      pointer-events:none;
    }

    .copy {
      width:min(480px, 92vw);

      opacity:0;

      transform:
        translateY(28px)
        scale(.95);

      transition:
        opacity:.4s ease,
        transform .5s cubic-bezier(.16,1,.3,1);

      pointer-events:auto;

      background:#fff;

      padding:
        clamp(16px, 4vw, 26px);

      border:5px solid var(--ink);

      box-shadow:
        8px 8px 0 rgba(0,0,0,.85);

      border-radius:8px;

      text-align:center;
    }

    .world.active .copy {
      opacity:1;
      transform:
        translateY(0)
        scale(1);
    }

    /* Comic typography */
    h1,
    h2 {
      margin:0;

      font-family:
        'Bangers',
        'Comic Neue',
        Georgia,
        serif;

      color:var(--ink);

      line-height:.95;

      text-wrap:balance;

      text-shadow:
        2px 2px 0 #fff,
        4px 4px 0 rgba(0,0,0,.9);
    }

    h1 {
      font-size:
        clamp(2rem, 7vw, 3.4rem);
    }

    h2 {
      font-size:
        clamp(1.8rem, 6vw, 3rem);
    }

    /* ========================= */
    /* INTRO VIDEO */
    /* ========================= */

    #introVideo {
      position:fixed;
      inset:0;

      z-index:10;

      width:100%;
      height:100%;

      object-fit:cover;

      display:block;

      transition:
        opacity 1.2s cubic-bezier(0.16,1,0.3,1),
        transform 1.2s cubic-bezier(0.16,1,0.3,1),
        filter 1.2s ease;

      cursor:pointer;
    }

    #introVideo.fade-out {
      opacity:0 !important;

      transform:scale(1.08);

      filter:blur(10px);

      pointer-events:none;
    }

    /* ========================= */
    /* GOTH INTRO MODAL */
    /* ========================= */

    #introOverlay {
      position:fixed;
      inset:0;

      z-index:15;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(
          circle at center,
          rgba(30,8,22,.88) 0%,
          rgba(5,3,8,.96) 100%
        );

      backdrop-filter:blur(10px);

      opacity:0;

      pointer-events:none;

      transition:opacity .6s ease;

      padding:16px;
    }

    #introOverlay.active {
      opacity:1;
      pointer-events:auto;
    }

    .intro-modal.goth-modal {
      width:min(500px, 92vw);

      background:#0d0811;

      border:3px solid #77122b;

      outline:1px solid #ff2255;
      outline-offset:-6px;

      box-shadow:
        0 0 35px rgba(255,20,80,.45),
        0 0 15px rgba(0,0,0,.9),
        inset 0 0 40px rgba(0,0,0,.95);

      border-radius:4px;

      padding:
        clamp(24px, 5vw, 36px);

      text-align:center;

      position:relative;

      transform:
        translateY(25px)
        scale(.94);

      transition:
        transform .5s cubic-bezier(.16,1,.3,1),
        box-shadow .5s ease;
    }

    #introOverlay.active .intro-modal.goth-modal {
      transform:
        translateY(0)
        scale(1);
    }

    .goth-modal::before,
    .goth-modal::after {
      content:'✦';

      position:absolute;

      color:#ff3366;

      font-size:1.2rem;

      text-shadow:
        0 0 8px #ff2255;
    }

    .goth-modal::before {
      top:8px;
      left:12px;
    }

    .goth-modal::after {
      bottom:8px;
      right:12px;
    }

    .goth-crest {
      font-family:
        'Cinzel Decorative',
        Georgia,
        serif;

      font-size:.85rem;

      letter-spacing:.35em;

      text-transform:uppercase;

      color:#bd93d8;

      text-shadow:
        0 0 10px rgba(189,147,216,.6);

      margin-bottom:8px;
    }

    .typewriter-text.goth-text {
      font-size:
        clamp(1.4rem, 5.2vw, 2.2rem);

      font-family:
        'Cinzel Decorative',
        'UnifrakturMaguntia',
        Georgia,
        serif;

      font-weight:700;

      letter-spacing:.04em;

      line-height:1.35;

      margin:14px 0 24px;

      min-height:2.8em;

      color:#f3e8f8;

      text-shadow:
        0 0 12px rgba(255,30,86,.75),
        2px 2px 4px #000;
    }

    .typewriter-cursor.goth-cursor {
      display:inline-block;

      width:3px;
      height:1.15em;

      background:#ff2255;

      box-shadow:
        0 0 10px #ff2255;

      vertical-align:middle;

      margin-left:5px;

      animation:
        gothBlink .8s step-start infinite;
    }

    @keyframes gothBlink {
      50% {
        opacity:0;
      }
    }

    .space-btn.goth-btn {
      appearance:none;

      border:2px solid #ff2255;

      background:
        linear-gradient(
          135deg,
          #240817 0%,
          #12030d 100%
        );

      color:#f7e1ee;

      font-family:
        'Cinzel Decorative',
        Georgia,
        serif;

      font-size:1.05rem;

      font-weight:900;

      letter-spacing:.16em;

      text-transform:uppercase;

      padding:14px 30px;

      cursor:pointer;

      border-radius:2px;

      box-shadow:
        0 0 18px rgba(255,34,85,.4),
        inset 0 0 12px rgba(255,34,85,.2);

      transition:all .25s ease;

      opacity:0;

      pointer-events:none;

      transform:translateY(10px);
    }

    .space-btn.goth-btn.show {
      opacity:1;

      pointer-events:auto;

      transform:translateY(0);
    }

    .space-btn.goth-btn:hover {
      background:
        linear-gradient(
          135deg,
          #440c26 0%,
          #200414 100%
        );

      box-shadow:
        0 0 25px rgba(255,34,85,.75),
        inset 0 0 16px rgba(255,34,85,.4);

      color:#fff;

      border-color:#ff5588;

      transform:translateY(-2px);
    }

    .space-btn.goth-btn:active {
      transform:translateY(2px);

      box-shadow:
        0 0 10px rgba(255,34,85,.6);
    }

    /* ========================= */
    /* BOTTOM NAVIGATION */
    /* ========================= */

    .nav {
      position:fixed;

      z-index:5;

      bottom:12px;

      left:50%;

      transform:translateX(-50%);

      display:flex;

      gap:10px;

      background:
        rgba(0,0,0,.45);

      padding:6px 14px;

      border-radius:20px;

      backdrop-filter:blur(4px);
    }

    .nav a {
      width:10px;
      height:10px;

      border:2px solid #fff;

      border-radius:50%;

      opacity:.45;

      background:transparent;

      transition:
        all .25s cubic-bezier(0.16,1,0.3,1);
    }

    .nav a.active {
      opacity:1;

      background:#ffd54f;

      border-color:#000;

      transform:scale(1.3);

      box-shadow:
        0 0 10px #ffd54f;
    }
  </style>
</head>

  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';


    const canvas =
      document.querySelector('#scene');

    const container =
      document.querySelector('#worldsContainer');

    const sections =
      [...document.querySelectorAll('.world')];

    const dots =
      [...document.querySelectorAll('.nav a')];


    /* ========================= */
    /* RENDERER */
    /* ========================= */

    const renderer =
      new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        alpha:true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
          window.innerHeight,
        0.1,
        100
      );

    camera.position.z = 13;


    /* ========================= */
    /* STARS */
    /* ========================= */

    const starsGeo =
      new THREE.BufferGeometry();

    const starCount = 650;

    const starCoords =
      new Float32Array(
        starCount * 3
      );

    for (
      let i = 0;
      i < starCoords.length;
      i += 3
    ) {

      starCoords[i] =
        (Math.random() - .5) * 45;

      starCoords[i + 1] =
        (Math.random() - .5) * 35;

      starCoords[i + 2] =
        -Math.random() * 30;

    }

    starsGeo.setAttribute(
      'position',
      new THREE.BufferAttribute(
        starCoords,
        3
      )
    );


    const starMat =
      new THREE.PointsMaterial({
        color:'#ffffff',
        size:.055,
        transparent:true,
        opacity:.85
      });


    scene.add(
      new THREE.Points(
        starsGeo,
        starMat
      )
    );


    /* ========================= */
    /* NEON TEXTURE */
    /* ========================= */

    function createNeonTexture(
      hexColor
    ) {

      const c =
        document.createElement(
          'canvas'
        );

      c.width = 512;
      c.height = 512;

      const ctx =
        c.getContext('2d');

      const grad =
        ctx.createRadialGradient(
          256,
          256,
          170,
          256,
          256,
          256
        );

      grad.addColorStop(
        0,
        hexColor
      );

      grad.addColorStop(
        .35,
        hexColor
      );

      grad.addColorStop(
        .7,
        hexColor
          .replace(
            ')',
            ', 0.4)'
          )
          .replace(
            'rgb',
            'rgba'
          )
      );

      grad.addColorStop(
        1,
        'rgba(0,0,0,0)'
      );

      ctx.fillStyle = grad;

      ctx.fillRect(
        0,
        0,
        512,
        512
      );

      return new THREE.CanvasTexture(c);
    }


    const textureLoader =
      new THREE.TextureLoader();


    function makePlanet(
      ref,
      fallbackColor
    ) {

      if (!ref) {

        return {
          type:'none',

          material:
            new THREE.MeshBasicMaterial({
              color:fallbackColor
            })
        };

      }


      const tex =
        textureLoader.load(
          ref,
          (t) => {

            t.colorSpace =
              THREE.SRGBColorSpace;

          }
        );


      tex.flipY = true;

      tex.colorSpace =
        THREE.SRGBColorSpace;


      return {
        type:'image',

        material:
          new THREE.MeshBasicMaterial({
            map:tex,
            side:THREE.DoubleSide
          })
      };

    }


    /* ========================= */
    /* PLANETS */
    /* ========================= */

    const isMobilePortrait =
      window.innerWidth <
      window.innerHeight;


    const planetRadius =
      isMobilePortrait
        ? 2.2
        : 2.8;


    const planets =
      sections.map(
        (section, index) => {

          const ref =
            section.dataset.image || '';


          const baseColor =
            new THREE.Color(
              section.dataset.color ||
              '#ffffff'
            );


          const neonColor =
            section.dataset.neon ||
            '#00ffff';


          const p =
            makePlanet(
              ref,
              baseColor
            );


          const group =
            new THREE.Group();


          /* Glow */

          const glowMat =
            new THREE.SpriteMaterial({
              map:
                createNeonTexture(
                  neonColor
                ),

              color:
                new THREE.Color(
                  neonColor
                ),

              transparent:true,

              opacity:.85,

              blending:
                THREE.AdditiveBlending
            });


          const glowSprite =
            new THREE.Sprite(
              glowMat
            );


          glowSprite.scale.set(
            planetRadius * 2.7,
            planetRadius * 2.7,
            1
          );


          glowSprite.position.z =
            -.15;


          group.add(
            glowSprite
          );


          /* Ring */

          const ringGeo =
            new THREE.RingGeometry(
              planetRadius * 1.03,
              planetRadius * 1.08,
              64
            );


          const ringMat =
            new THREE.MeshBasicMaterial({
              color:
                new THREE.Color(
                  neonColor
                ),

              side:
                THREE.DoubleSide,

              transparent:true,

              opacity:.95,

              blending:
                THREE.AdditiveBlending
            });


          const orbitRing =
            new THREE.Mesh(
              ringGeo,
              ringMat
            );


          orbitRing.position.z =
            -.05;


          group.add(
            orbitRing
          );


          /* Planet */

          const planetMesh =
            new THREE.Mesh(
              new THREE.CircleGeometry(
                planetRadius,
                64
              ),
              p.material
            );


          group.add(
            planetMesh
          );


          group.scale.setScalar(
            4.5
          );


          scene.add(
            group
          );


          return {
            group,
            glowSprite,
            orbitRing,
            index,

            neonColor:
              new THREE.Color(
                neonColor
              )
          };

        }
      );


    /* ========================= */
    /* SCROLL */
    /* ========================= */

    let target = 0;
    let smooth = 0;
    let active = -1;

    let scrollVelocity = 0;
    let lastSmooth = 0;


    function update() {

      const scrollLeft =
        container.scrollLeft;


      const width =
        container.clientWidth ||
        window.innerWidth;


      target =
        Math.max(
          0,

          Math.min(
            sections.length - 1,

            scrollLeft /
              width
          )
        );


      const next =
        Math.round(target);


      sections.forEach(
        (s, i) =>
          s.classList.toggle(
            'active',
            i === next
          )
      );


      dots.forEach(
        (d, i) =>
          d.classList.toggle(
            'active',
            i === next
          )
      );


      if (sections[next]) {

        document.body.style.background =
          sections[next].dataset.bg;

      }


      active = next;

    }


    container.addEventListener(
      'scroll',
      update,
      {
        passive:true
      }
    );


    dots.forEach(
      (dot, idx) => {

        dot.addEventListener(
          'click',
          (e) => {

            e.preventDefault();

            container.scrollTo({

              left:
                idx *
                container.clientWidth,

              behavior:
                'smooth'

            });

          }
        );

      }
    );


    window.addEventListener(
      'resize',
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        update();

      }
    );


    update();


    /* ========================= */
    /* HELPERS */
    /* ========================= */

    const clamp =
      (v, min, max) =>
        Math.max(
          min,
          Math.min(
            max,
            v
          )
        );


    const easeOutBack =
      (t) => {

        const c1 = 1.6;
        const c3 = c1 + 1;

        return (
          1 +
          c3 *
            Math.pow(
              t - 1,
              3
            ) +
          c1 *
            Math.pow(
              t - 1,
              2
            )
        );

      };


    /* ========================= */
    /* INTRO */
    /* ========================= */

    let introActive = false;

    let introStart = 0;

    let introDuration = 1400;

    let introPlayed = false;


    const introVideo =
      document.getElementById(
        'introVideo'
      );


    const introOverlay =
      document.getElementById(
        'introOverlay'
      );


    const typedTarget =
      document.getElementById(
        'typedTarget'
      );


    const launchBtn =
      document.getElementById(
        'launchBtn'
      );


    /* ========================= */
    /* ANIMATION */
    /* ========================= */

    function draw() {

      requestAnimationFrame(draw);


      lastSmooth = smooth;


      smooth +=
        (target - smooth) *
        .1;


      scrollVelocity =
        Math.abs(
          smooth -
          lastSmooth
        ) * 45;


      const now =
        performance.now();


      const timeSec =
        now * .002;


      starMat.opacity =
        .65 +
        Math.sin(
          timeSec * 2
        ) * .25;


      const isMobile =
        window.innerWidth <
        window.innerHeight;


      const verticalElevation =
        isMobile
          ? 1.5
          : .4;


      const horizontalSpacing =
        isMobile
          ? 7.8
          : 10.5;


      planets.forEach(
        ({
          group,
          glowSprite,
          orbitRing,
          index,
          neonColor
        }) => {

          const offset =
            smooth -
            index;


          const clamped =
            Math.max(
              -1,
              Math.min(
                1,
                offset
              )
            );


          const distance =
            Math.abs(
              clamped
            );


          const posX =
            -clamped *
            horizontalSpacing;


          const posY =
            verticalElevation +
            Math.cos(
              clamped *
              Math.PI *
              .5
            ) *
            .5;


          const posZ =
            -distance * 4.5;


          group.position.set(
            posX,
            posY,
            posZ
          );


          const baseScale =
            Math.max(
              .45,
              1 -
              distance * .38
            );


          if (!introPlayed) {

            if (introActive) {

              const delay =
                index * 80;


              const localT =
                clamp(
                  (
                    now -
                    introStart -
                    delay
                  ) /
                  introDuration,

                  0,
                  1
                );


              const ease =
                easeOutBack(
                  localT
                );


              const finalScale =
                4.5 +
                (
                  baseScale -
                  4.5
                ) *
                ease;


              group.scale.setScalar(
                Math.max(
                  .01,
                  finalScale
                )
              );


              group.rotation.z =
                (
                  1 - ease
                ) *
                .6 *
                (
                  index % 2
                    ? 1
                    : -1
                );


            } else {

              group.scale.setScalar(
                4.5
              );

            }


          } else {

            group.scale.setScalar(
              baseScale
            );

            group.rotation.z = 0;

          }


          /* Ring animation */

          orbitRing.rotation.z =
            timeSec *
            (
              index % 2 === 0
                ? 1
                : -1
            ) +
            smooth * 1.5;


          const ringPulse =
            1 +
            Math.sin(
              timeSec * 4 +
              index
            ) * .04 +
            scrollVelocity * .08;


          orbitRing.scale.set(
            ringPulse,
            ringPulse,
            1
          );


          orbitRing.material.opacity =
            clamp(
              .5 +
              scrollVelocity * .6 -
              distance * .4,

              .2,
              1
            );


          /* Glow */

          const glowPulse =
            (
              planetRadius * 2.7
            ) +
            Math.sin(
              timeSec * 3 +
              index
            ) * .2 +
            scrollVelocity * 1.8;


          glowSprite.scale.set(
            glowPulse,
            glowPulse,
            1
          );


          glowSprite.material.opacity =
            clamp(
              (
                1 -
                distance * .7
              ) *
              (
                .65 +
                scrollVelocity * .5
              ),

              .15,
              1
            );


          if (
            scrollVelocity >
            .1
          ) {

            glowSprite.material.color
              .setHSL(

                (
                  neonColor.getHSL({
                    h:0,
                    s:0,
                    l:0
                  }).h +

                  scrollVelocity *
                  .05

                ) % 1,

                1,

                .6
              );


          } else {

            glowSprite.material.color
              .copy(
                neonColor
              );

          }


          group.visible =
            distance < 1.35;

        }
      );


      renderer.render(
        scene,
        camera
      );

    }


    draw();


    /* ========================= */
    /* TYPEWRITER */
    /* ========================= */

    let modalOpened = false;


    const messageText =
      "Hope your week is going well... here is some pure cinema.";


    function showPopUp() {

      if (
        modalOpened ||
        introPlayed
      ) {
        return;
      }


      modalOpened = true;


      introOverlay.classList.add(
        'active'
      );


      let charIdx = 0;


      function typeNextChar() {

        if (
          charIdx <
          messageText.length
        ) {

          typedTarget.textContent +=
            messageText.charAt(
              charIdx
            );


          charIdx++;


          setTimeout(
            typeNextChar,
            42
          );


        } else {

          launchBtn.classList.add(
            'show'
          );

        }

      }


      setTimeout(
        typeNextChar,
        350
      );

    }


    /* ========================= */
    /* START GALAXY */
    /* ========================= */

    function triggerPlanetIntro() {

      if (introPlayed) {
        return;
      }


      introActive = true;


      introStart =
        performance.now();


      introDuration = 1400;


      introOverlay.classList.remove(
        'active'
      );


      if (introVideo) {

        introVideo.classList.add(
          'fade-out'
        );

      }


      setTimeout(
        () => {

          introActive = false;

          introPlayed = true;


          if (
            introVideo &&
            introVideo.parentNode
          ) {

            introVideo.parentNode
              .removeChild(
                introVideo
              );

          }


          if (
            introOverlay &&
            introOverlay.parentNode
          ) {

            introOverlay.parentNode
              .removeChild(
                introOverlay
              );

          }

        },

        introDuration +
        200 +
        (
          planets.length *
          80
        )
      );

    }


    launchBtn.addEventListener(
      'click',
      triggerPlanetIntro
    );


    /* ========================= */
    /* VIDEO EVENTS */
    /* ========================= */

    if (introVideo) {

      introVideo.addEventListener(
        'ended',
        showPopUp
      );


      introVideo.addEventListener(
        'timeupdate',
        () => {

          if (
            !modalOpened &&
            introVideo.duration &&
            introVideo.currentTime >=
              introVideo.duration -
              .25
          ) {

            showPopUp();

          }

        }
      );


      introVideo.addEventListener(
        'click',
        () => {

          introVideo.pause();

          showPopUp();

        }
      );

    }

  </script>

</body>
</html>
